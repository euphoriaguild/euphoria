# Deploy recomendado: Docker (ODBC SQL Server)
# Dashboard Render → New → Web Service → Docker

services:
  - type: web
    name: euphoria-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health/db
    envVars:
      - key: AUTH_PROVIDER
        value: self
      - key: COOKIE_SECURE
        value: "true"
      - key: JWT_ISSUER
        value: euphoria-api
      - key: JWT_AUDIENCE
        value: euphoria-app
      - key: ACCESS_TOKEN_TTL_SEC
        value: "3600"
      - key: REFRESH_TOKEN_TTL_SEC
        value: "2592000"
      - key: SQLSERVER_HOST
        sync: false
      - key: SQLSERVER_PORT
        value: "1433"
      - key: SQLSERVER_DATABASE
        value: euphoria
      - key: SQLSERVER_USER
        sync: false
      - key: SQLSERVER_PASSWORD
        sync: false
      - key: SQLSERVER_ENCRYPT
        value: "yes"
      - key: SQLSERVER_TRUST_SERVER_CERTIFICATE
        value: "yes"
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: CORS_ORIGINS
        sync: false
